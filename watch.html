<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch | Anime Pakistan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-flag" aria-hidden="true">
          <svg viewBox="0 0 60 40" width="36" height="24" xmlns="http://www.w3.org/2000/svg">
            <rect width="60" height="40" fill="#01411C"/>
            <rect width="15" height="40" fill="#fff"/>
            <circle cx="34" cy="20" r="9" fill="#fff"/>
            <circle cx="37" cy="20" r="7.5" fill="#01411C"/>
            <polygon fill="#fff" points="42,14 43.2,17.5 46.8,17.5 43.9,19.6 45,23 42,20.8 39,23 40.1,19.6 37.2,17.5 40.8,17.5"/>
          </svg>
        </span>
        <span class="logo-text"><span class="logo-pk">Pakistan</span><span class="logo-an">Anime</span></span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="browse.html" class="nav-link">Browse</a>
        <a href="browse.html?type=series" class="nav-link">Series</a>
        <a href="browse.html?type=movies" class="nav-link">Movies</a>
      </nav>
      <div class="header-actions">
        <button class="btn-icon" id="searchBtn" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="btn-icon" id="themeToggle" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="browse.html">Browse</a>
    <a href="browse.html?type=series">Series</a>
    <a href="browse.html?type=movies">Movies</a>
  </div>

  <main class="main">
    <div class="container" style="padding-top:24px;padding-bottom:40px" id="playerRoot">
      <!-- player injected by JS -->
    </div>
  </main>

    <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="text-align:center;padding:28px 0 16px;border-top:1px solid var(--border)">
        <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:8px">© 2026 Pakistan Anime Web — Free Anime Streaming PK (Educational Project)</p>
        <a href="admin.html" style="color:var(--text-muted);font-size:0.8rem;opacity:0.7">Admin</a>
      </div>
    </div>
  </footer>

  <div class="modal" id="searchModal">
    <div class="modal-content search-modal">
      <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search anime movies or series..." />
        <button class="modal-close" id="searchClose">×</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

  <nav class="bottom-nav" id="bottomNav" aria-label="Main">
    <a href="index.html" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      <span>Home</span>
    </a>
    <a href="#" data-nav="search" id="bottomSearch">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search</span>
    </a>
    <a href="browse.html?type=series" data-nav="series">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 13h10M7 17h8"/></svg>
      <span>Series</span>
    </a>
    <a href="browse.html?type=movies" data-nav="movies">
      <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="m10 9 5 3-5 3V9z"/></svg>
      <span>Movies</span>
    </a>
  </nav>

</body>
</html>
